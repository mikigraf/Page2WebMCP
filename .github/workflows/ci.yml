name: Verify Page2WebMCP

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test:all
      - run: pnpm test:db:local
